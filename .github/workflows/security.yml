name: Security Scan

on:
  push:
    branches: [ main ]
  schedule:
    # Every Monday at 6:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # allow manual trigger

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24   # or '22' if you prefer LTS
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high severity)
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Summarise vulnerabilities
        if: steps.audit.outcome == 'failure'
        run: |
          echo "## ⚠️ Security Vulnerabilities Found" >> $GITHUB_STEP_SUMMARY
          echo "Run 'npm audit fix' locally or review the report above." >> $GITHUB_STEP_SUMMARY
          exit 1   # fail the workflow